# Nagłówki bezpieczeństwa dla mojniezbednik.pl
# Skopiuj do: /etc/nginx/snippets/security-headers.conf
# W bloku server { ... } strony dodaj:   include snippets/security-headers.conf;
# i USUŃ stare linie add_header z tymi samymi nazwami (inaczej będą podwójne).
# Uwaga nginx: jeśli w jakimś bloku location jest własne add_header,
# to ten include trzeba dodać również tam.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# KROK 1 (teraz): obecna polityka + dodatkowe zabezpieczenia, nic się nie zepsuje.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

# KROK 2 (gdy skrypty z <script>...</script> zostaną przeniesione do plików .js):
# zakomentuj linię wyżej i odkomentuj tę:
# add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

# Ukryj wersję nginx
server_tokens off;
